# PR'larda yayından önce kontrol: panelin (apps/cms) tip denetimi. Yayın yapmaz.
name: Kontrol
on:
  pull_request:
    branches: [main]
    paths: ['apps/cms/**', 'packages/**', '.github/workflows/kontrol.yml']
permissions: { contents: read }
jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Tip denetimi (panel)
        run: npx tsc --noEmit -p apps/cms
