# Stüdyo taşıması için girilen gizli bilgileri DENER (değerleri yazmaz): Stüdyo bulut veritabanı, Gemini, Groq, e-posta (SMTP).
name: Anahtar kontrolü
on:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  dene:
    runs-on: ubuntu-latest
    env:
      DB_SIFRE: ${{ secrets.STUDYO_DB_SIFRE }}
      GEMINI: ${{ secrets.GEMINI_API_KEY }}
      GROQ: ${{ secrets.GROQ_API_KEY }}
      SMTP_SIFRE: ${{ secrets.SMTP_PASSWORD }}
      PEXELS: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY: ${{ secrets.PIXABAY_API_KEY }}
      REF: fulmooonidwrqyybbkvu
    steps:
      - name: Dene
        run: |
          s() { echo "$1" >> /tmp/sonuc.txt; }
          # Kopyalarken giren baş/son boşluk ve satır sonları atılır (sonuç satırında belirtilir)
          temiz() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          for v in DB_SIFRE SMTP_SIFRE GEMINI GROQ; do t=$(temiz "${!v}"); [ "$t" != "${!v}" ] && s "not: $v değerinde baş/son boşluk vardı (${#t}/${#v} değil, temizlendi)"; printf -v "$v" '%s' "$t"; export "$v"; done
          s "uzunluk: DB_SIFRE ${#DB_SIFRE} karakter · SMTP ${#SMTP_SIFRE} karakter"
          # Stüdyo veritabanı: bölge bilinmediği için havuz adresleri sırayla denenir (yanlış bölge "tenant not found" der)
          if [ -z "$DB_SIFRE" ]; then s "STUDYO_DB_SIFRE: girilmemiş"; else
            sonuc="bağlanamadı"
            for b in eu-central-1 eu-west-1 eu-west-2 eu-west-3 eu-north-1 eu-central-2 us-east-1 us-east-2 us-west-1 ap-southeast-1; do
              for a in aws-0 aws-1; do
                out=$(PGPASSWORD="$DB_SIFRE" PGCONNECT_TIMEOUT=8 psql "host=$a-$b.pooler.supabase.com port=5432 dbname=postgres user=postgres.$REF sslmode=require" -tAc "select count(*) from auth.users" 2>&1) && { sonuc="DOĞRU (bölge $b, $out kullanıcı)"; break 2; }
                echo "$out" | grep -qi "password authentication failed" && { sonuc="ŞİFRE YANLIŞ (bölge $b)"; break 2; }
              done
            done
            s "STUDYO_DB_SIFRE: $sonuc"
          fi
          if [ -z "$GEMINI" ]; then s "GEMINI_API_KEY: girilmemiş"; else
            k=$(curl -s -o /dev/null -w '%{http_code}' "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI"); s "GEMINI_API_KEY: $([ "$k" = 200 ] && echo DOĞRU || echo "HATALI ($k)")"; fi
          if [ -z "$GROQ" ]; then s "GROQ_API_KEY: girilmemiş"; else
            k=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GROQ" https://api.groq.com/openai/v1/models); s "GROQ_API_KEY: $([ "$k" = 200 ] && echo DOĞRU || echo "HATALI ($k)")"; fi
          if [ -z "$SMTP_SIFRE" ]; then s "SMTP_PASSWORD: girilmemiş"; else
            k=$(python3 -c "
          import smtplib,os,ssl
          sifre=os.environ['SMTP_SIFRE']; sonuc=[]
          for h in ['mail.kurumsaleposta.com','mail.updated.com.tr','smtp.kurumsaleposta.com']:
            for p in (465,587):
              for u in ('studio@updated.com.tr','studio'):
                try:
                  c=smtplib.SMTP_SSL(h,p,timeout=15) if p==465 else smtplib.SMTP(h,p,timeout=15)
                  if p==587: c.starttls(context=ssl.create_default_context())
                  c.login(u,sifre); c.quit(); sonuc.append(f'DOĞRU: {h}:{p} kullanıcı {u}'); break
                except smtplib.SMTPAuthenticationError: sonuc.append(f'{h}:{p} {u}: şifre reddedildi')
                except Exception as e: sonuc.append(f'{h}:{p} {u}: bağlanamadı ({type(e).__name__})'); break
          ok=[x for x in sonuc if x.startswith('DOĞRU')]
          print(ok[0] if ok else 'ŞİFRE YANLIŞ · ' + ' | '.join(sonuc))
          "); s "SMTP_PASSWORD: $k"; fi
          [ -n "$PEXELS" ] && s "PEXELS_API_KEY: $([ "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: $PEXELS" 'https://api.pexels.com/v1/search?query=phone&per_page=1')" = 200 ] && echo DOĞRU || echo HATALI)" || s "PEXELS_API_KEY: girilmemiş (isteğe bağlı)"
          [ -n "$PIXABAY" ] && s "PIXABAY_API_KEY: $([ "$(curl -s -o /dev/null -w '%{http_code}' "https://pixabay.com/api/?key=$PIXABAY&q=phone&per_page=3")" = 200 ] && echo DOĞRU || echo HATALI)" || s "PIXABAY_API_KEY: girilmemiş (isteğe bağlı)"
          cat /tmp/sonuc.txt
          node -e "const t=require('fs').readFileSync('/tmp/sonuc.txt','utf8');console.log('::notice title=Sonuç::'+t.replace(/%/g,'%25').replace(/\n/g,'%0A'))"
