# Yayın panelini (Payload) sunucuya kurar ve günceller. Sunucu: Oracle (şimdi) / Natro VPS (sonra) — aynı betik.
# Gerekenler (Secrets): PANEL_SSH_HOST (sunucu IP), PANEL_SSH_KEY (özel anahtar), DATABASE_URI (Supabase),
#   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY (Supabase Storage). DATABASE_URI yerine yalnız SUPABASE_DB_PASSWORD de yeter. İsteğe bağlı: PANEL_SSH_USER (varsayılan ubuntu), GITHUB_DISPATCH_TOKEN.
# Değişkenler (Variables, isteğe bağlı): SUPABASE_REF (proje kimliği; S3 adreslerini kurar), PANEL_DOMAIN, WEB_URL.
name: Paneli kur ve güncelle

on:
  push:
    branches: [main]
    paths: ['apps/cms/**', 'packages/**', 'deploy/panel/**', '.github/workflows/panel.yml']
  workflow_dispatch:

concurrency: { group: panel, cancel-in-progress: false }
permissions: { contents: write }

jobs:
  panel:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.PANEL_SSH_HOST || vars.PANEL_SSH_HOST }}
      USR: ${{ secrets.PANEL_SSH_USER || vars.PANEL_SSH_USER || 'root' }}
      PORT: ${{ secrets.PANEL_SSH_PORT || vars.PANEL_SSH_PORT || '22' }}
      KEY: ${{ secrets.PANEL_SSH_KEY }}
      PASS: ${{ secrets.PANEL_SSH_PASSWORD }}
      DOMAIN: ${{ vars.PANEL_DOMAIN || 'panel.updated.com.tr' }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      DB_PASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ vars.SUPABASE_REF || secrets.SUPABASE_REF || 'werbsodzhfxliffveexk' }}
      REGION: ${{ vars.SUPABASE_REGION || 'eu-west-2' }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      WEB_URL: ${{ vars.WEB_URL || 'http://v2.updated.com.tr' }}
      DISPATCH: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
    steps:
      - name: Ayar kontrolü
        id: ayar
        run: |
          # Veritabanı adresi: DATABASE_URI girildiyse o; yoksa proje kimliği + bölge + şifreden (Session pooler) kurulur.
          if [ -z "$DATABASE_URI" ] && [ -n "$DB_PASS" ]; then
            q=$(python3 -c 'import os,urllib.parse as u;print(u.quote(os.environ["DB_PASS"],safe=""))')
            DATABASE_URI="postgresql://postgres.$REF:$q@aws-0-$REGION.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$q"; echo "::add-mask::$DATABASE_URI"; echo "DATABASE_URI=$DATABASE_URI" >> "$GITHUB_ENV"
          fi
          eksik=""; for k in HOST DATABASE_URI; do [ -n "${!k}" ] || eksik="$eksik $k"; done; [ -n "$KEY$PASS" ] || eksik="$eksik PANEL_SSH_KEY/PANEL_SSH_PASSWORD"
          if [ -n "$eksik" ]; then echo "::warning title=Panel::Eksik ayar:$eksik — kurulum atlandı."; echo "ok=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - if: steps.ayar.outputs.ok == '1'
        uses: actions/checkout@v5
      - name: SSH hazırla
        if: steps.ayar.outputs.ok == '1'
        run: |
          mkdir -p ~/.ssh
          if [ -n "$KEY" ]; then printf '%s\n' "$KEY" > ~/.ssh/id; else
            # İlk kurulum root şifresiyle: kalıcı bir anahtar üretilip sunucuya eklenir, sonraki bağlantılar anahtarla.
            sudo apt-get install -y -qq sshpass >/dev/null; ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id
            ssh-keyscan -p "$PORT" -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if ! SSHPASS="$PASS" sshpass -e ssh-copy-id -p "$PORT" -i ~/.ssh/id.pub -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$USR@$HOST" > /tmp/copy.log 2>&1; then
              # Teşhis: port açık mı, sunucu hangi giriş yöntemlerine izin veriyor?
              p=$(timeout 10 bash -c "</dev/tcp/$HOST/$PORT" 2>&1 && echo açık || echo "kapalı/erişilemiyor")
              m=$(ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o PreferredAuthentications=none "$USR@$HOST" 2>&1 | grep -io 'permission denied ([^)]*)' | head -1)
              b=$(timeout 10 bash -c "exec 3<>/dev/tcp/$HOST/$PORT; head -c 60 <&3" 2>/dev/null | tr -d '\r\n')
              echo "::error title=SSH girişi::Port $PORT: $p · sunucu: ${b:-?} · izin verilen yöntemler: ${m:-?} · ayrıntı: $(tail -c 400 /tmp/copy.log | tr '\n' ' ')"
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/id
          ssh-keyscan -p "$PORT" -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Host panel
            HostName $HOST
            User $USR
            Port $PORT
            IdentityFile ~/.ssh/id
            ServerAliveInterval 30
            StrictHostKeyChecking accept-new" > ~/.ssh/config
          ssh panel 'echo "bağlandı: $(uname -m) $(lsb_release -ds 2>/dev/null)"' 2>&1 | tee /tmp/ssh.log || { echo "::error title=SSH::$(tail -c 800 /tmp/ssh.log | tr '\n' ' ')"; exit 1; }
      - name: Ortam dosyası
        if: steps.ayar.outputs.ok == '1'
        run: |
          {
            echo "DATABASE_URI=$DATABASE_URI"
            echo "PAYLOAD_PUBLIC_SERVER_URL=https://$DOMAIN"
            echo "WEB_URL=$WEB_URL"
            echo "EXTRA_ORIGINS=https://v2.updated.com.tr,http://v2.updated.com.tr,https://updated-studio.github.io,https://updated.com.tr"
            echo "STUDIO_URL=https://studio.updated.com.tr"
            if [ -n "$REF" ] && [ -n "$S3_ACCESS_KEY_ID" ]; then
              echo "S3_BUCKET=media"; echo "S3_REGION=$REGION"
              echo "S3_ENDPOINT=https://$REF.supabase.co/storage/v1/s3"
              echo "S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID"; echo "S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY"
              echo "MEDIA_PUBLIC_URL=https://$REF.supabase.co/storage/v1/object/public/media"
            fi
            echo "GITHUB_REPO=${{ github.repository }}"
            [ -n "$DISPATCH" ] && echo "GITHUB_DISPATCH_TOKEN=$DISPATCH"
          } > /tmp/panel.env
          scp -q /tmp/panel.env deploy/panel/kur.sh deploy/panel/guncelle.sh panel:/tmp/
          ssh panel 'sudo install -m 640 /tmp/panel.env /etc/updated-panel.env && rm /tmp/panel.env'
      - name: Sunucuyu hazırla
        if: steps.ayar.outputs.ok == '1'
        run: ssh panel "sudo PANEL_DOMAIN=$DOMAIN bash /tmp/kur.sh" 2>&1 | tee /tmp/kur.log; test ${PIPESTATUS[0]} -eq 0 || { echo "::error title=Sunucu kurulumu::$(tail -c 3000 /tmp/kur.log | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')"; exit 1; }
      - name: Paneli güncelle (indir, göç, derle, başlat)
        if: steps.ayar.outputs.ok == '1'
        run: ssh panel "sudo bash /tmp/guncelle.sh" 2>&1 | tee /tmp/gun.log; test ${PIPESTATUS[0]} -eq 0 || { echo "::error title=Panel güncelleme::$(tail -c 5000 /tmp/gun.log | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')"; exit 1; }
      - name: Yeni göç dosyalarını depoya yaz
        if: steps.ayar.outputs.ok == '1'
        run: |
          mkdir -p apps/cms/src/migrations
          scp -q 'panel:/opt/updated/site/apps/cms/src/migrations/*' apps/cms/src/migrations/ 2>/dev/null || true
          if [ -n "$(git status --porcelain apps/cms/src/migrations)" ]; then
            git config user.name "updated-panel"; git config user.email "panel@updated.com.tr"
            git add apps/cms/src/migrations && git commit -m "Panel: veritabanı göç dosyaları (otomatik)" && git push
          fi
      - name: Durum
        if: steps.ayar.outputs.ok == '1'
        run: |
          s=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 20 "https://$DOMAIN/admin" || true)
          l=$(ssh panel 'curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/admin')
          echo "::notice title=Panel::sunucu içi /admin → $l · https://$DOMAIN/admin → $s (DNS ve sertifika hazırsa 200)"
