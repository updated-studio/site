# Natro VPS ölçümü (yalnız okur, hiçbir şeyi değiştirmez): işlemci, bellek, disk, çalışan servisler, panel veritabanı boyutu.
# Altyapının tamamını Natro'ya taşıma planı için (Fatih, 23 Ekim 2026). Actions → "Sunucu ölçümü" → Run workflow.
name: Sunucu ölçümü
on:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  olc:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.PANEL_SSH_HOST || vars.PANEL_SSH_HOST }}
      USR: ${{ secrets.PANEL_SSH_USER || vars.PANEL_SSH_USER || 'root' }}
      PORT: ${{ secrets.PANEL_SSH_PORT || vars.PANEL_SSH_PORT || '22' }}
      KEY: ${{ secrets.PANEL_SSH_KEY }}
      PASS: ${{ secrets.PANEL_SSH_PASSWORD }}
    steps:
      - name: SSH hazırla
        run: |
          mkdir -p ~/.ssh
          if [ -n "$KEY" ]; then printf '%s\n' "$KEY" > ~/.ssh/id; else
            # İlk kurulum root şifresiyle: kalıcı bir anahtar üretilip sunucuya eklenir, sonraki bağlantılar anahtarla.
            sudo apt-get install -y -qq sshpass >/dev/null; ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id
            ssh-keyscan -p "$PORT" -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if ! SSHPASS="$PASS" sshpass -e ssh-copy-id -p "$PORT" -i ~/.ssh/id.pub -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$USR@$HOST" > /tmp/copy.log 2>&1; then
              # Teşhis: port açık mı, sunucu hangi giriş yöntemlerine izin veriyor?
              p=$(timeout 10 bash -c "</dev/tcp/$HOST/$PORT" 2>&1 && echo açık || echo "kapalı/erişilemiyor")
              m=$(ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o PreferredAuthentications=none "$USR@$HOST" 2>&1 | grep -io 'permission denied ([^)]*)' | head -1)
              b=$(timeout 10 bash -c "exec 3<>/dev/tcp/$HOST/$PORT; head -c 60 <&3" 2>/dev/null | tr -d '\r\n')
              echo "::error title=SSH girişi::Port $PORT: $p · sunucu: ${b:-?} · izin verilen yöntemler: ${m:-?} · ayrıntı: $(tail -c 400 /tmp/copy.log | tr '\n' ' ')"
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/id
          ssh-keyscan -p "$PORT" -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Host panel
            HostName $HOST
            User $USR
            Port $PORT
            IdentityFile ~/.ssh/id
            ServerAliveInterval 30
            StrictHostKeyChecking accept-new" > ~/.ssh/config
          # root değilse: bir kez şifresiz sudo tanımlanır (kurulum betikleri sudo ile çalışır)
          if [ "$USR" != "root" ] && [ -n "$PASS" ]; then
            printf '%s\n' "$PASS" | ssh panel "sudo -S -p '' sh -c 'echo \"$USR ALL=(ALL) NOPASSWD:ALL\" > /etc/sudoers.d/90-updated-panel && chmod 440 /etc/sudoers.d/90-updated-panel'" || { echo "::error title=SSH::$USR için sudo ayarlanamadı"; exit 1; }
          fi
          ssh panel 'echo "bağlandı: $(uname -m) $(lsb_release -ds 2>/dev/null)"' 2>&1 | tee /tmp/ssh.log || { echo "::error title=SSH::$(tail -c 800 /tmp/ssh.log | tr '\n' ' ')"; exit 1; }

      - name: Ölç
        run: |
          ssh panel 'bash -s' > /tmp/olcum.txt 2>&1 <<'UZAK'
          echo "## Sistem"; lsb_release -ds 2>/dev/null; uname -m; echo "çekirdek: $(nproc)"; lscpu | grep -E "Model name|MHz" | head -2
          echo "## Bellek"; free -h
          echo "## Disk"; df -h / /opt 2>/dev/null | sort -u
          echo "## Yük"; uptime
          echo "## Servisler"; systemctl list-units --type=service --state=running --no-pager --no-legend | awk '{print $1}' | grep -vE "^(systemd|dbus|getty|cron|rsyslog|ssh|polkit|unattended|networkd|user@|serial)" | head -30
          echo "## Docker"; (command -v docker && docker --version) || echo "docker yok"
          echo "## Açık portlar"; sudo ss -ltnp | awk 'NR>1{print $4, $6}' | sed 's/users:((//' | cut -c1-80
          echo "## Panel belleği"; systemctl show updated-panel -p MemoryCurrent -p MemoryMax 2>/dev/null
          echo "## Panel klasörü"; sudo du -sh /opt/updated 2>/dev/null
          echo "## Panel veritabanı (Supabase) boyutu"
          cd /opt/updated/site/apps/cms 2>/dev/null && sudo bash -c 'set -a; . /etc/updated-panel.env 2>/dev/null; set +a; node -e "
            const {Client}=require(\"pg\");const c=new Client({connectionString:process.env.DATABASE_URI});
            c.connect().then(async()=>{const r=await c.query(\"select pg_size_pretty(pg_database_size(current_database())) b, (select count(*) from payload.news) h, (select count(*) from payload.media) m\");console.log(JSON.stringify(r.rows[0]));await c.end()}).catch(e=>console.log(\"hata: \"+e.message))"' 2>&1 | tail -2
          UZAK
          cat /tmp/olcum.txt
          node -e "const t=require('fs').readFileSync('/tmp/olcum.txt','utf8').slice(0,3800);console.log('::notice title=Ölçüm::'+t.replace(/%/g,'%25').replace(/\r/g,'').replace(/\n/g,'%0A'))"
