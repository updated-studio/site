# WordPress → panel taşıması. Panel sunucusunda çalışır (veritabanı ve görsel deposu orada bağlı).
# Tetik: deploy/wp/tasi.json değişince ya da elle. Ayarlar o dosyada: dry (yalnız say), limit (ilk N yazı), reviewCategory, scoreMeta.
# Gerekenler (Secrets): WP_USER, WP_APP_PASSWORD (WordPress › Profil › Uygulama Parolaları) + panel SSH bilgileri.
name: WordPress taşıması

on:
  push:
    branches: [main]
    paths: ['deploy/wp/tasi.json']
  workflow_dispatch:

concurrency: { group: wp-tasi, cancel-in-progress: false }
permissions: { contents: write }

jobs:
  tasi:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HOST: ${{ secrets.PANEL_SSH_HOST || vars.PANEL_SSH_HOST }}
      USR: ${{ secrets.PANEL_SSH_USER || vars.PANEL_SSH_USER || 'root' }}
      PORT: ${{ secrets.PANEL_SSH_PORT || vars.PANEL_SSH_PORT || '22' }}
      PASS: ${{ secrets.PANEL_SSH_PASSWORD }}
      WP_URL: ${{ vars.WP_URL || 'https://updated.com.tr' }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Ayarlar
        id: a
        run: |
          [ -n "$WP_USER" ] && [ -n "$WP_APP_PASSWORD" ] || { echo "::error title=WordPress::WP_USER ve WP_APP_PASSWORD girilmemiş"; exit 1; }
          echo "dry=$(jq -r '.dry' deploy/wp/tasi.json)" >> "$GITHUB_OUTPUT"
          echo "limit=$(jq -r '.limit // 0' deploy/wp/tasi.json)" >> "$GITHUB_OUTPUT"
          echo "rc=$(jq -r '.reviewCategory // ""' deploy/wp/tasi.json)" >> "$GITHUB_OUTPUT"
          echo "sm=$(jq -r '.scoreMeta // ""' deploy/wp/tasi.json)" >> "$GITHUB_OUTPUT"
      - name: SSH
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p ~/.ssh && ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id
          ssh-keyscan -p "$PORT" -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSHPASS="$PASS" sshpass -e ssh-copy-id -p "$PORT" -i ~/.ssh/id.pub "$USR@$HOST" >/dev/null 2>&1
          printf 'Host panel\n HostName %s\n User %s\n Port %s\n IdentityFile ~/.ssh/id\n ServerAliveInterval 30\n' "$HOST" "$USR" "$PORT" > ~/.ssh/config
      - name: Taşı
        env:
          DRY: ${{ steps.a.outputs.dry }}
          LIMIT: ${{ steps.a.outputs.limit }}
          RC: ${{ steps.a.outputs.rc }}
          SM: ${{ steps.a.outputs.sm }}
        run: |
          d=""; [ "$DRY" = "true" ] && d="DRY_RUN=1"
          q() { printf %q "$1"; }
          ssh panel "sudo -u panel -H bash -c 'set -a; . /etc/updated-panel.env; . /etc/updated-panel.secrets; set +a; cd /opt/updated/site/apps/cms && $d LIMIT=$LIMIT WP_URL=$(q "$WP_URL") WP_USER=$(q "$WP_USER") WP_APP_PASSWORD=$(q "$WP_APP_PASSWORD") WP_REVIEW_CATEGORY=$(q "$RC") WP_SCORE_META=$(q "$SM") timeout 4h npx payload run scripts/wp-migrate.ts'" 2>&1 | tee /tmp/tasi.log
          s=${PIPESTATUS[0]}
          ozet=$(ssh panel 'cat /opt/updated/site/apps/cms/scripts/wp-migrate.log.json 2>/dev/null' | jq -c '{categories,authors,media,news,reviews,redirects,dry,atlanan:(.skipped|length),hata:(.errors|length),ilk_hatalar:(.errors[:5])}' 2>/dev/null)
          echo "::notice title=Taşıma özeti::${ozet:-özet yok} · son satır: $(grep -v '^\s*$' /tmp/tasi.log | tail -1 | cut -c1-300)"
          [ $s -eq 0 ] || { echo "::error title=Taşıma::$(tail -c 3000 /tmp/tasi.log | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')"; exit 1; }
      - name: Yönlendirmeleri depoya yaz
        if: steps.a.outputs.dry != 'true'
        run: |
          scp -q panel:/opt/updated/site/apps/web/src/redirects.json apps/web/src/redirects.json || exit 0
          if [ -n "$(git status --porcelain apps/web/src/redirects.json)" ]; then
            git config user.name "updated-panel"; git config user.email "panel@updated.com.tr"
            git add apps/web/src/redirects.json && git commit -m "WordPress eski adres yönlendirmeleri (otomatik)" && git push
          fi
