# Natro'daki Stüdyo kopyasını dener (sabit kontroller; keyfi komut çalıştırmaz): bir haber toplama turu, veritabanı yazması,
# fonksiyonların ayakta olması. Stüdyo arayüzünün kullanacağı AÇIK (herkese açık, tarayıcıya konan) anahtarı da yazar.
name: Stüdyo denemesi (Natro)
on:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: panel, cancel-in-progress: false }
jobs:
  dene:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.PANEL_SSH_HOST || vars.PANEL_SSH_HOST }}
      USR: ${{ secrets.PANEL_SSH_USER || vars.PANEL_SSH_USER || 'root' }}
      PORT: ${{ secrets.PANEL_SSH_PORT || vars.PANEL_SSH_PORT || '22' }}
      KEY: ${{ secrets.PANEL_SSH_KEY }}
      PASS: ${{ secrets.PANEL_SSH_PASSWORD }}
    steps:
      - name: SSH hazırla
        run: |
          mkdir -p ~/.ssh
          if [ -n "$KEY" ]; then printf '%s\n' "$KEY" > ~/.ssh/id; else
            # İlk kurulum root şifresiyle: kalıcı bir anahtar üretilip sunucuya eklenir, sonraki bağlantılar anahtarla.
            sudo apt-get install -y -qq sshpass >/dev/null; ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id
            ssh-keyscan -p "$PORT" -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if ! SSHPASS="$PASS" sshpass -e ssh-copy-id -p "$PORT" -i ~/.ssh/id.pub -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$USR@$HOST" > /tmp/copy.log 2>&1; then
              # Teşhis: port açık mı, sunucu hangi giriş yöntemlerine izin veriyor?
              p=$(timeout 10 bash -c "</dev/tcp/$HOST/$PORT" 2>&1 && echo açık || echo "kapalı/erişilemiyor")
              m=$(ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o PreferredAuthentications=none "$USR@$HOST" 2>&1 | grep -io 'permission denied ([^)]*)' | head -1)
              b=$(timeout 10 bash -c "exec 3<>/dev/tcp/$HOST/$PORT; head -c 60 <&3" 2>/dev/null | tr -d '\r\n')
              echo "::error title=SSH girişi::Port $PORT: $p · sunucu: ${b:-?} · izin verilen yöntemler: ${m:-?} · ayrıntı: $(tail -c 400 /tmp/copy.log | tr '\n' ' ')"
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/id
          ssh-keyscan -p "$PORT" -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Host panel
            HostName $HOST
            User $USR
            Port $PORT
            IdentityFile ~/.ssh/id
            ServerAliveInterval 30
            StrictHostKeyChecking accept-new" > ~/.ssh/config
          # root değilse: bir kez şifresiz sudo tanımlanır (kurulum betikleri sudo ile çalışır)
          if [ "$USR" != "root" ] && [ -n "$PASS" ]; then
            printf '%s\n' "$PASS" | ssh panel "sudo -S -p '' sh -c 'echo \"$USR ALL=(ALL) NOPASSWD:ALL\" > /etc/sudoers.d/90-updated-panel && chmod 440 /etc/sudoers.d/90-updated-panel'" || { echo "::error title=SSH::$USR için sudo ayarlanamadı"; exit 1; }
          fi
          ssh panel 'echo "bağlandı: $(uname -m) $(lsb_release -ds 2>/dev/null)"' 2>&1 | tee /tmp/ssh.log || { echo "::error title=SSH::$(tail -c 800 /tmp/ssh.log | tr '\n' ' ')"; exit 1; }

      - name: Dene
        run: |
          ssh panel 'bash -s' > /tmp/d.txt 2>&1 <<'UZAK'
          q() { sudo docker exec supabase-db psql -X -tA -U supabase_admin -d postgres -c "$1"; }
          echo "önce: haber $(q 'select count(*) from public.tr_items') · son kayıt $(q "select to_char(max(created_at) at time zone 'Europe/Istanbul','DD.MM HH24:MI') from public.tr_items")"
          r=$(curl -s -m 170 -o /tmp/r.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "$( [ -n "$ZORLA" ] && echo '{"zorla":true}' || echo '{}' )" http://127.0.0.1:8000/functions/v1/triyaj-topla)
          echo "haber toplama: $r · $(head -c 300 /tmp/r.txt | tr '\n' ' ')"
          sleep 60
          echo "sonra: haber $(q 'select count(*) from public.tr_items') · son kayıt $(q "select to_char(max(created_at) at time zone 'Europe/Istanbul','DD.MM HH24:MI') from public.tr_items")"
          echo "son toplama özeti: $(q "select left(value::text, 400) from public.tr_settings where key='son_toplama'")"
          echo "son 10 dk eklenen/güncellenen haber: $(q "select count(*) from public.tr_items where updated_at > now() - interval '10 minutes'")"
          echo "kaynak kontrolü (son 10 dk): $(q "select count(*) from public.tr_sources where last_check > now() - interval '10 minutes'") kaynak"
          echo "fonksiyon hataları (son 5 dk): $(sudo docker logs --since 5m supabase-edge-functions 2>&1 | grep -ciE 'error|uncaught')"
          sudo docker logs --since 5m supabase-edge-functions 2>&1 | grep -iE 'error|uncaught' | grep -viE 'key|token|password|secret' | cut -c1-160 | tail -5
          echo "--- son taslaklar (no · otomatik · kontrol · panel no · panel hatası)"
          q "select id||' · '||auto||' · '||coalesce(qc_state,'')||' · '||coalesce(site_id::text,'-')||' · '||left(coalesce(site_hata,''),160)||' · '||to_char(created_at at time zone 'Europe/Istanbul','HH24:MI') from public.tr_drafts order by id desc limit 6"
          echo "oto ayarı: $(q "select left(value::text,200) from public.tr_settings where key='oto_taslak'")"
          echo "son oto: $(q "select left(value::text,250) from public.tr_settings where key='oto_son'")"
          echo "kategori önbelleği: $(q "select coalesce(jsonb_array_length(value->'liste'),0) from public.tr_settings where key='site_kategoriler'")"
          echo "--- triyaj-taslak kayıtları (son 30 dk, hata)"
          sudo docker logs --since 30m supabase-edge-functions 2>&1 | grep -iE 'error|hata|fail|refused|ENOTFOUND|401|422' | grep -viE 'key=|token|password|secret' | cut -c1-200 | tail -8
          echo "panel ucu sunucudan: $(curl -s -o /dev/null -w '%{http_code}' https://panel.updated.com.tr/api/triyaj/durum)"
          echo "panel ucu fonksiyon kabından: $(sudo docker exec supabase-edge-functions sh -c 'wget -q -S -O /dev/null https://panel.updated.com.tr/api/triyaj/durum 2>&1 | grep -m1 HTTP' 2>&1 | tr -d '\n' | cut -c1-80)"
          echo "STUDYO_ACIK_ANAHTAR_B64=$(sudo sed -n 's/^ANON_KEY=//p' /opt/updated/supabase/.env | base64 -w0)"
          free -h | sed -n 2p
          UZAK
          cat /tmp/d.txt
          node -e "const t=require('fs').readFileSync('/tmp/d.txt','utf8').slice(0,3500);console.log('::notice title=Stüdyo denemesi::'+t.replace(/%/g,'%25').replace(/\r/g,'').replace(/\n/g,'%0A'))"
