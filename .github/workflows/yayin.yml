# Siteyi derler ve yayınlar.
# - hazirlik: GitHub Pages (deneme). CMS_URL boşsa örnek verilerle açılır.
# - natro:    Natro'ya FTP ile yükler (yalnız değişen dosyalar), ardından IndexNow.
# Tetikler: main'e push, panelde yayın (repository_dispatch: yayin), elle, her gece 04.00 (TR) güvenlik derlemesi.
# Ayarlar: Settings › Secrets and variables › Actions (aşağıdaki vars.* ve secrets.*).
name: Siteyi derle ve yayınla

on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/**', '.github/**']
  repository_dispatch:
    types: [yayin]
  workflow_dispatch:
    inputs:
      hedef:
        description: Nereye?
        type: choice
        options: [hepsi, hazirlik, natro]
        default: hepsi
  schedule:
    - cron: '0 1 * * *'

# Peş peşe yayınlar: çalışan derleme biter, bekleyen tek derleme en son hâli alır.
# Her hedefin kendi sırası var: GitHub Pages takılırsa Natro yayını beklemez.

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  hazirlik:
    concurrency: { group: yayin-pages, cancel-in-progress: true }
    if: vars.HAZIRLIK_PAGES == '1' && (github.event_name != 'workflow_dispatch' || inputs.hedef != 'natro')
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    env:
      SITE_URL: ${{ vars.HAZIRLIK_URL }}
      BASE_PATH: ${{ vars.HAZIRLIK_BASE }}
      CMS_URL: ${{ vars.CMS_URL || 'https://panel.updated.com.tr' }}
      MEDIA_PUBLIC_URL: ${{ format('https://{0}.supabase.co/storage/v1/object/public/media', vars.SUPABASE_REF || 'werbsodzhfxliffveexk') }}
      STAGING: '1'
      SHOW_AD_SLOTS: '1'
      PUBLIC_BULTEN_URL: ${{ vars.PUBLIC_BULTEN_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Önbellek (npm paketleri ve görseller)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            apps/web/.medya-cache
          key: web-${{ runner.arch }}-${{ hashFiles('apps/web/package.json', 'package.json') }}-${{ github.run_id }}
          restore-keys: web-${{ runner.arch }}-
      - run: .github/calistir.sh Kurulum npm install --workspace apps/web --no-audit --no-fund --legacy-peer-deps --prefer-offline
      - run: .github/calistir.sh Derleme npm run build --workspace apps/web
      - name: Paket sürümlerini sabitle (package-lock.json ilk kez oluştuysa depoya yaz)
        run: |
          if [ -f package-lock.json ] && ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "updated-site"; git config user.email "site@updated.com.tr"
            git add package-lock.json && git commit -m "Paket sürümleri sabitlendi (package-lock.json) [skip ci]" && git push || true
          fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }
      - id: deploy
        uses: actions/deploy-pages@v4

  natro:
    concurrency: { group: yayin-natro, cancel-in-progress: false }
    # Ayarlar Variables ya da Secrets olarak girilebilir (ikisi de okunur).
    if: github.event_name != 'workflow_dispatch' || inputs.hedef != 'hazirlik'
    runs-on: ubuntu-latest
    env:
      NATRO_ON: ${{ vars.NATRO || secrets.NATRO }}
      # Girilmezse hazırlık adresi: v2.updated.com.tr
      SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL || 'https://v2.updated.com.tr' }}
      CMS_URL: ${{ vars.CMS_URL || secrets.CMS_URL || 'https://panel.updated.com.tr' }}
      MEDIA_PUBLIC_URL: ${{ format('https://{0}.supabase.co/storage/v1/object/public/media', vars.SUPABASE_REF || 'werbsodzhfxliffveexk') }}
      STAGING: ${{ vars.NATRO_STAGING || secrets.NATRO_STAGING }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      PUBLIC_BULTEN_URL: ${{ vars.PUBLIC_BULTEN_URL }}
      NATRO_DIR: ${{ vars.NATRO_DIR || secrets.NATRO_DIR }}
      NATRO_ANA_SITE: ${{ vars.NATRO_ANA_SITE }}
      NATRO_FTP_KILITLI: ${{ vars.NATRO_FTP_KILITLI || secrets.NATRO_FTP_KILITLI }}
      NATRO_FTP_PROTOCOL: ${{ vars.NATRO_FTP_PROTOCOL || secrets.NATRO_FTP_PROTOCOL || 'ftps' }}
      NATRO_FTP_SECURITY: ${{ vars.NATRO_FTP_SECURITY || secrets.NATRO_FTP_SECURITY || 'loose' }}
      NATRO_FTP_HOST: ${{ secrets.NATRO_FTP_HOST || vars.NATRO_FTP_HOST }}
      NATRO_FTP_USER: ${{ secrets.NATRO_FTP_USER || vars.NATRO_FTP_USER }}
      NATRO_FTP_PASSWORD: ${{ secrets.NATRO_FTP_PASSWORD }}
    steps:
      - name: Ayarları denetle
        id: ayar
        run: |
          eksik=""
          for k in NATRO_ON SITE_URL NATRO_DIR NATRO_FTP_HOST NATRO_FTP_USER NATRO_FTP_PASSWORD; do [ -n "${!k}" ] || eksik="$eksik $k"; done
          if [ "$NATRO_ON" != "1" ]; then echo "::notice title=Natro::NATRO=1 girilmemiş; Natro yüklemesi atlandı.${eksik:+ Eksik:$eksik}"; echo "aktif=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -n "$eksik" ]; then echo "::error title=Natro ayarları eksik::$eksik"; exit 1; fi
          echo "Hedef: $SITE_URL · klasör: $NATRO_DIR · protokol: $NATRO_FTP_PROTOCOL · hazırlık: ${STAGING:-0}"
          d="$NATRO_DIR"; [ "${d%/}" = "$d" ] && d="$d/"; echo "dir=$d" >> "$GITHUB_OUTPUT"
          echo "aktif=1" >> "$GITHUB_OUTPUT"
      - if: steps.ayar.outputs.aktif == '1'
        uses: actions/checkout@v5
      - if: steps.ayar.outputs.aktif == '1'
        uses: actions/setup-node@v5
        with: { node-version: 22 }
      - if: steps.ayar.outputs.aktif == '1'
        name: Önbellek (npm paketleri ve görseller)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            apps/web/.medya-cache
          key: web-${{ runner.arch }}-${{ hashFiles('apps/web/package.json', 'package.json') }}-${{ github.run_id }}
          restore-keys: web-${{ runner.arch }}-
      - if: steps.ayar.outputs.aktif == '1'
        run: .github/calistir.sh Kurulum npm install --workspace apps/web --no-audit --no-fund --legacy-peer-deps --prefer-offline
      - name: Derle (canlıda CMS adresi zorunlu — örnek veri canlıya çıkmaz)
        if: steps.ayar.outputs.aktif == '1'
        run: |
          if [ "$STAGING" != "1" ] && [ -z "$CMS_URL" ]; then echo "::error title=Derleme::CMS_URL boş"; exit 1; fi
          .github/calistir.sh Derleme npm run build --workspace apps/web
      - name: Güvenlik kontrolü (ana siteye dokunma)
        if: steps.ayar.outputs.aktif == '1'
        run: .github/natro-kontrol.sh
      - name: Natro'ya yükle (yalnız değişen dosyalar; kopmada yeniden dener)
        if: steps.ayar.outputs.aktif == '1'
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          for deneme in 1 2 3; do
            node deploy/natro-yukle.mjs apps/web/dist 2>&1 | tee /tmp/yukle.log && [ ${PIPESTATUS[0]} -eq 0 ] && exit 0
            echo "Deneme $deneme başarısız, yeniden…"; sleep 10
          done
          node -e "const t=require('fs').readFileSync('/tmp/yukle.log','utf8').slice(-5000);console.log('::error title=FTP yükleme::'+t.replace(/%/g,'%25').replace(/\n/g,'%0A'))"
          exit 1
      - name: Teşhis
        if: always() && steps.ayar.outputs.aktif == '1'
        run: .github/teshis.sh
      - name: IndexNow
        if: steps.ayar.outputs.aktif == '1' && env.STAGING != '1'
        env:
          CHANGED_PATHS: ${{ join(github.event.client_payload.paths, ',') }}
        run: node apps/web/scripts/indexnow.mjs
