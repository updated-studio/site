# Natro VPS'e Supabase'in açık kaynak sürümünü (yalın) kurar/günceller: takas alanı, Docker, db/auth/rest/realtime/storage/functions/api-gw.
# Tüm altyapıyı Natro'ya taşıma, aşama 1 (Fatih, 23 Ekim 2026). Elle tetiklenir. Gizli değerler sunucuda üretilir ve orada kalır.
name: Altyapı (Supabase, Natro)
on:
  workflow_dispatch:
    inputs:
      panel_tasi: { description: 'Panel verisini ve görsellerini Natroya taşı', type: boolean, default: false }
  push:
    branches: [main]
    paths: ['deploy/altyapi/**']
permissions: { contents: read }
concurrency: { group: panel, cancel-in-progress: false }
jobs:
  kur:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.PANEL_SSH_HOST || vars.PANEL_SSH_HOST }}
      USR: ${{ secrets.PANEL_SSH_USER || vars.PANEL_SSH_USER || 'root' }}
      PORT: ${{ secrets.PANEL_SSH_PORT || vars.PANEL_SSH_PORT || '22' }}
      KEY: ${{ secrets.PANEL_SSH_KEY }}
      PASS: ${{ secrets.PANEL_SSH_PASSWORD }}
      DOMAIN: ${{ vars.PANEL_DOMAIN || 'panel.updated.com.tr' }}
    steps:
      - uses: actions/checkout@v5
      - name: SSH hazırla
        run: |
          mkdir -p ~/.ssh
          if [ -n "$KEY" ]; then printf '%s\n' "$KEY" > ~/.ssh/id; else
            # İlk kurulum root şifresiyle: kalıcı bir anahtar üretilip sunucuya eklenir, sonraki bağlantılar anahtarla.
            sudo apt-get install -y -qq sshpass >/dev/null; ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id
            ssh-keyscan -p "$PORT" -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if ! SSHPASS="$PASS" sshpass -e ssh-copy-id -p "$PORT" -i ~/.ssh/id.pub -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$USR@$HOST" > /tmp/copy.log 2>&1; then
              # Teşhis: port açık mı, sunucu hangi giriş yöntemlerine izin veriyor?
              p=$(timeout 10 bash -c "</dev/tcp/$HOST/$PORT" 2>&1 && echo açık || echo "kapalı/erişilemiyor")
              m=$(ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o PreferredAuthentications=none "$USR@$HOST" 2>&1 | grep -io 'permission denied ([^)]*)' | head -1)
              b=$(timeout 10 bash -c "exec 3<>/dev/tcp/$HOST/$PORT; head -c 60 <&3" 2>/dev/null | tr -d '\r\n')
              echo "::error title=SSH girişi::Port $PORT: $p · sunucu: ${b:-?} · izin verilen yöntemler: ${m:-?} · ayrıntı: $(tail -c 400 /tmp/copy.log | tr '\n' ' ')"
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/id
          ssh-keyscan -p "$PORT" -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Host panel
            HostName $HOST
            User $USR
            Port $PORT
            IdentityFile ~/.ssh/id
            ServerAliveInterval 30
            StrictHostKeyChecking accept-new" > ~/.ssh/config
          # root değilse: bir kez şifresiz sudo tanımlanır (kurulum betikleri sudo ile çalışır)
          if [ "$USR" != "root" ] && [ -n "$PASS" ]; then
            printf '%s\n' "$PASS" | ssh panel "sudo -S -p '' sh -c 'echo \"$USR ALL=(ALL) NOPASSWD:ALL\" > /etc/sudoers.d/90-updated-panel && chmod 440 /etc/sudoers.d/90-updated-panel'" || { echo "::error title=SSH::$USR için sudo ayarlanamadı"; exit 1; }
          fi
          ssh panel 'echo "bağlandı: $(uname -m) $(lsb_release -ds 2>/dev/null)"' 2>&1 | tee /tmp/ssh.log || { echo "::error title=SSH::$(tail -c 800 /tmp/ssh.log | tr '\n' ' ')"; exit 1; }

      - name: Kur
        run: |
          ssh panel 'rm -rf /tmp/altyapi && mkdir -p /tmp/altyapi'
          scp -q deploy/altyapi/* panel:/tmp/altyapi/
          ssh panel "sudo PANEL_DOMAIN=$DOMAIN bash /tmp/altyapi/kur.sh" 2>&1 | tee /tmp/kur.log
          node -e "const t=require('fs').readFileSync('/tmp/kur.log','utf8').slice(-2500);console.log('::notice title=Kurulum::'+t.replace(/%/g,'%25').replace(/\r/g,'').replace(/\n/g,'%0A'))"
      - name: Panel verisini taşı
        if: github.event.inputs.panel_tasi == 'true'
        run: |
          ssh panel "sudo PANEL_DOMAIN=$DOMAIN YENIDEN=1 bash /tmp/altyapi/panel-tasi.sh" 2>&1 | tee /tmp/tasi.log
          s=${PIPESTATUS[0]}
          node -e "const t=require('fs').readFileSync('/tmp/tasi.log','utf8').slice(-2500);console.log('::notice title=Panel taşıma::'+t.replace(/%/g,'%25').replace(/\r/g,'').replace(/\n/g,'%0A'))"
          exit $s
      - name: Durum
        if: always()
        run: |
          ssh panel "D=$DOMAIN bash -s" > /tmp/durum.txt 2>&1 <<'UZAK'
          cd /opt/updated/supabase 2>/dev/null || { echo "kurulum yok"; exit 0; }
          A=$(sudo sed -n 's/^ANON_KEY=//p' .env)
          for y in auth/v1/health rest/v1/ storage/v1/status; do
            echo "iç  $y → $(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $A" -H "Authorization: Bearer $A" http://127.0.0.1:8000/$y)"
          done
          echo "dış auth/v1/health → $(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $A" https://$D/auth/v1/health)"
          echo "panel /admin → $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/admin)"
          free -h | sed -n 1,3p
          sudo docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' | sed 's/supabase-//'
          df -h / | tail -1
          UZAK
          cat /tmp/durum.txt
          node -e "const t=require('fs').readFileSync('/tmp/durum.txt','utf8').slice(0,3000);console.log('::notice title=Durum::'+t.replace(/%/g,'%25').replace(/\r/g,'').replace(/\n/g,'%0A'))"
